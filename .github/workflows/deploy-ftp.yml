name: Deploy to FTP

on:
  push:
    branches:
      - claude/martin-birthday-escape-game-u2kiyb
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Websupport's plain FTP/FTPS (port 21) resets connections coming
      # from GitHub Actions runners (likely an IP/firewall block on
      # cloud datacenter ranges), so we deploy over SFTP (port 22)
      # instead, using the same account credentials.
      - name: Deploy over SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "index.html,style.css,script.js"
          target: "./"
          overwrite: true

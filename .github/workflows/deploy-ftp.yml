name: Deploy to FTP

on:
  push:
    branches:
      - claude/martin-birthday-escape-game-u2kiyb
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          # Folder on the FTP server the files should land in. "./" means
          # the FTP account's root folder — change it if you want a
          # subfolder, e.g. "./martin-oslava/".
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md

name: Deploy to FTP

on:
  push:
    branches:
      - claude/martin-birthday-escape-game-u2kiyb
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Websupport's plain FTP/FTPS (port 21) resets the connection from
      # GitHub Actions runners, and their SSH account only allows the SFTP
      # subsystem (no shell/exec), which ruled out SCP/rsync-over-ssh too.
      # Stage just the game files so we don't push .git/.github to the host.
      - name: Stage deploy files
        run: |
          mkdir -p deploy
          cp index.html style.css script.js deploy/

      # TEMPORARY debug step: previous attempts got the connection closed
      # right after the SSH handshake, before any file transfer, which
      # looks like an auth rejection. Running the real openssh sftp
      # client in verbose mode shows the exact reason instead of relying
      # on a wrapper action's limited log output.
      - name: Debug SFTP connection
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e sftp -v -o StrictHostKeyChecking=no -o BatchMode=no -P 22 "$FTP_USERNAME@$FTP_SERVER" <<'EOF' || true
          pwd
          ls
          bye
          EOF
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
